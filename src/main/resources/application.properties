spring.application.name=sklad
spring.datasource.url=jdbc:postgresql://localhost:5432/nco
spring.datasource.username=postgres
spring.datasource.password=12345

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.default_schema = sklad
spring.datasource.driver-class-name=org.postgresql.Driver

#developement configuration
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

logging.level.org.hibernate.sql = DEBUG
logging.level.org.hibernate.orm.jdbc.bind = TRACE

spring.servlet.multipart.max-file-size = 15MB
spring.servlet.multipart.max-request-size = 15MB

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

sklad.upload-dir = uploads

#spring.jackson.serialization.indent-output=true


app.pagination.small=50
app.pagination.big=100
app.pagination.test=2