<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<head>
  <link rel="stylesheet" href="../../static/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../static/css/styles.css">
  <link rel="stylesheet" href="../../static/css/flatpickr.min.css">
  <link rel="stylesheet" href="../../static/css/select2.min.css">
  <link rel="stylesheet" href="../../static/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../static/css/bootstrap-icons.css">

  <script src="../../static/js/bootstrap.bundle.min.js"> </script>
  <script src="../../static/js/jquery-4.0.0.min.js"> </script>
  <script src="../../static/js/script.js"> </script>
  <script src="../../static/js/flatpickr.min.js"> </script>
  <script src="../../static/js/select2.min.js"> </script>
  <script src="../../static/js/popups.js"> </script>
</head>
<body>

  <div th:fragment="div-modal-new-unit">

    <div class="modal-header bg-secondary text-white py-1">
      <h6 class="modal-title">Нова одиниця майна</h6>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <form th:action="@{/unit/save}" th:object="${new_unit}" method="post">

      <div class="modal-body">

        <div class="container-fluid p-3">

          <div class="row p-0">
            <div class="col-12">
              <label for="denomination_select" class="col-form-label-sm">найменування:</label>
                <select id="denomination_select" th:field="*{denomination}">
                  <option value=" "></option>
                  <option th:each="denomination: ${denominations}"
                          th:text="${denomination.title}"
                          th:value="${denomination.id}"></option>
                </select>
            </div>
          </div>

            <div class="row p-0">
                <div class="col-9">
                    <label for="nomenclature_select" class="col-form-label-sm">номенклатура:</label>
                    <select id="nomenclature_select" th:field="*{nomenclature}"> </select>
                </div>
                <div class="col">
                    <label for="card_number_added" class="col-form-label-sm">картка:</label>
                    <input type="text" class="form-control form-control-sm" id="card_number_added" readonly>
                </div>
                <div class="col-1">
                    <label for="unit_card_number_id" class="col-form-label-sm">id:</label>
                    <input type="text" id="unit_card_number_id" class="form-control form-control-sm" readonly>
                </div>
            </div>

          <div class="row p-0">
                        <div class="col">
                          <label for="serial_num" class="col-form-label-sm">серійний/заводський номер:</label>
                          <input type="text" class="form-control form-control-sm" id="serial_num" th:field="*{serialNumber}">
                        </div>
                        <div class="col">
                          <label class="col-form-label-sm">категорія майна:</label>
                          <div class="btn-group w-100 gap-1 btn-group-sm" role="group" aria-label="Категорія">
                                            <input type="radio" class="btn-check" th:field="*{category}" id="category1" value="1">
                                            <label class="btn btn-light" for="category1">I</label>

                                            <input type="radio"
                                                   class="btn-check"
                                                   th:field="*{category}"
                                                   id="category2"
                                                   value="2">
                                            <label class="btn btn-light" for="category2">II</label>

                                            <input type="radio"
                                                   class="btn-check"
                                                   th:field="*{category}"
                                                   id="category3"
                                                   value="3">
                                            <label class="btn btn-light" for="category3">III</label>

                                            <input type="radio"
                                                   class="btn-check"
                                                   th:field="*{category}"
                                                   id="category4"
                                                   value="4">
                                            <label class="btn btn-light" for="category4">IV</label>

                                            <input type="radio"
                                                   class="btn-check"
                                                   th:field="*{category}"
                                                   id="category5"
                                                   value="5">
                                            <label class="btn btn-light" for="category5">V</label>
                          </div>
                        </div>

              <div class="col">
                  <label for="unit_year" class="col-form-label-sm">рік виготовлення:</label>
                  <input type="number" class="form-control form-control-sm" id="unit_year" th:field="*{unitYear}">
              </div>
              <div class="col">
                  <label for="unit_price" class="col-form-label-sm">ціна:</label>
                  <input type="number" step="0.00001" class="form-control form-control-sm" id="unit_price" th:field="*{price}" th:value="${'0,00'}">
              </div>
          </div>

          <div class="row p-0">
            <div class="col">
              <label class="col-form-label-sm m-0" for="unit_state">стан:</label>
              <select id="unit_state" class="form-select">
                  <option></option>
                  <option>справна</option>
                  <option>втречено</option>
                  <option>пошкоджено</option>
                  <option>знищено</option>
                  <option>вилучено поліцією</option>
              </select>
            </div>
              <div class="col">
              <label class="col-form-label-sm m-0" for="unit_kit">комплектність:</label>
              <select id="unit_kit" class="form-select">
                  <option></option>
                  <option>комплект 01</option>
                  <option>комплект 01</option>
                  <option>комплект 01</option>
                  <option>комплект 01</option>
                  <option>комплект 01</option>
              </select>
            </div>
          </div>

              <div class="row">
                  <div class="col-12">
                    <label class="col-form-label-sm m-0" for="doc_comments">примітка:</label>
                    <input type="text" class="form-control" id="doc_comments" value="примітка" th:field="*{comment}">
              </div></div>
        </div><!--[end div container-fluid]-->
          <!--------------------------------------------------------------------[ div container-fluid new card form ]-->

          <div class="container-fluid p-3" style="height: 250px" th:object="${new_card}">

                  <div class="card">
                      <div class="card-header">
                          нова картка
                      </div>
                      <div class="card-body">
                          <div class="row">
                              <div class="col">
                                  <label for="card_number" class="small">номер картки:</label>
                                  <div class="input-group">
                                      <input class="form-control border-secondary border-end-0" id="card_number" type="number" th:field="*{cardNumber}" min="1" max="99999" step="1">
                                      <span id="spinner_loading" class="input-group-text border-secondary border-start-0 bg-white py-0" hidden>
                                          <div class="spinner-border spinner-border-sm small" role="status"> </div>
                                      </span>
                                      <button class="btn btn-outline-secondary btnGetNewCardNumber" id="btn_get_next_num_card" type="button" value="">+ номер</button>
                                      <button class="btn btn-outline-secondary btnFoundCardNumber" id="btn_found_card_number" type="button" value=""> &#128270; пошук</button>
                                  </div>
                              </div>
                              <div class="col">
                                  <label for="created_at" class="small">дата створення:</label>
                                  <input id="created_at" class="form-control form-control" type="datetime-local" value="" th:field="*{createdAt}">
                                  <input type="hidden" readonly id="field_doc_type_id" name="doc_type_id" th:field="*{docType}">
                              </div>

                              <div class="col">
                                  <label for="field_comment" class="small">примітка:</label>
                                  <input id="field_comment" class="form-control form-control" type="text" th:field="*{comments}">
                              </div>
                              <div class="col-1">
                                  <label for="btn-create-new-card" class="small"> </label>
                                  <button class="btn btn-secondary" type="button" id="btn-create-new-card">додати</button>
                              </div>
                          </div>

                          <div class="row">
                          </div>

                      </div>
                  </div>
          </div>


<!---------------------------------------------------------------------------------------------------------[ footer ]-->
      <div class="modal-footer justify-content-between">

        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
          <label class="form-check-label" for="flexCheckDefault">
            не закривати поточну форму
          </label>
        </div>
        <div>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Відміна</button>
          <button id="inputDocSubmit" class="btn btn-primary">Зберегти</button>
        </div>
      </div>
      </div>
    </form>


      <div class="row">
          <div class="col-12">
              <span id="small_log_bar" class="bg-body-tertiary border border-secondary w-100">ffdd</span>
          </div>
      </div>
  </div>

</body>
</html>
